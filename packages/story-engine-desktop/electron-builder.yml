# electron-builder 配置（桌面 MVP 任务③）。
# 打包对象是 pnpm deploy 产出的扁平 staging 目录（--projectDir 传入），不是本工作区
# （工作区 node_modules 是 pnpm 软链 + 带 devDeps + 带 darwin 专属二进制，直接打必坏）。
# 产 staging：pnpm --filter story-engine-desktop deploy --legacy --prod --config.node-linker=hoisted <dir>
appId: com.storyengine.desktop
productName: StoryEngine
# staging 里没有 electron devDep，版本在这里钉死（与工作区 devDep 保持一致）。
electronVersion: 43.0.0

# MVP 选 asar:false：ESM(main.mjs) + 全外置 node_modules 场景下最稳（研究标的最高风险点就是
# asar 内 Mastra 的 ESM 解析）。代价是文件数多、首次安装略慢——内测可接受，瘦身押后。
asar: false

files:
  - "**/*"
  # 单测文件不进包（node --test 只在工作区跑）。
  - "!*.test.mjs"
  # 构建期工具（打包脚本、生成第三方许可清单、抄 Electron 许可的钩子），不进包。
  - "!build-desktop*.sh"
  - "!gen-notices.mjs"
  - "!electron-licenses.cjs"
  # 应用图标源文件（下面 mac / win 的 icon 用），不进 app 目录。
  - "!assets/**"
  # 默认配置是无密钥包；预置模式由 build-desktop.sh 生成一次性配置显式移除此排除项。
  - "!preset-model-config/**"

directories:
  output: dist-electron

mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.productivity
  icon: assets/icon.icns
  # 没有开发者账号：用 ad-hoc 签名把整个应用包封好。只靠链接器给主程序签的那一下，应用包是「签了一半」，
  # 从网上下载后 macOS 直接说「已损坏」、只能敲命令；封好后走 系统设置 → 隐私与安全性 →「仍要打开」。
  # 上正式签名时换成开发者证书、打开 hardenedRuntime 并配 notarize。
  identity: "-"
  hardenedRuntime: false

win:
  icon: assets/icon.png
  target:
    - target: nsis
      arch: [x64]

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

# staging 已是纯 JS 生产依赖（实测 0 个 .node），不需要任何重建。
# Mac 版 electron-builder 会删 Electron 自带的许可文件，解包后先抄进应用包（P11）。
afterExtract: ./electron-licenses.cjs

npmRebuild: false
nodeGypRebuild: false
